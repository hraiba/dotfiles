"$schema" = "https://starship.rs/config-schema.json"

palette = "gruvbox_dark"

format = """
$os \
${custom.left_bracket}\
$directory\
${custom.right_bracket}\
$git_branch\
$git_status\
$dotnet\
$c\
$golang\
$rust\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$character
"""

# ======================
# 🎨 PALETTE
# ======================

[palettes.gruvbox_dark]
fg0 = "#fbf1c7"
fg1 = "#ebdbb2"
fg2 = "#d5c4a1"
bg0 = "#282828"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"

red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
purple = "#b16286"
aqua = "#689d6a"
orange = "#d65d0e"
gray = "#928374"

# ======================
# 🖥 OS
# ======================

[os]
disabled = false
style = "fg:fg2"

[os.symbols]
Windows = "󰍲"
Ubuntu  = "󰕈"
SUSE    = ""
Raspbian= "󰐿"
Mint    = "󰣭"
Macos   = ""
Manjaro = ""
Linux   = "󰌽"
Gentoo  = "󰣨"
Fedora  = "󰣛"
Alpine  = ""
Amazon  = ""
Android = ""
Arch    = "󰣇"
Artix   = "󰣇"
CentOS  = ""
Debian  = "󰣚"
Redhat  = "󱄛"
RedHatEnterprise = "󱄛"
CachyOS = ""

# ======================
# 📁 DIRECTORY + BRACKETS
# ======================

[custom.left_bracket]
command = "echo '['"
when = "true"
style = "fg:orange"

[directory]
style = "fg:fg1"
format = "[$path ]($style)"
truncation_length = 1
truncation_symbol = ""

[custom.right_bracket]
command = "echo ']'"
when = "true"
style = "fg:orange"

# ======================
# 🌱 GIT
# ======================

[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "fg:purple"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:yellow"

conflicted = "[ ](fg:red)"
modified   = "[ ](fg:orange)"
staged     = "[● ](fg:green)"
renamed    = "[➜ ](fg:blue)"
deleted    = "[✘ ](fg:red)"
untracked  = "[? ](fg:gray)"

ahead      = "[⇡${count} ](fg:green)"
behind     = "[⇣${count} ](fg:red)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count} ](fg:orange)"

up_to_date = "[ ](fg:green)"
stashed    = "[ ](fg:aqua)"

# ======================
# 🧠 LANGUAGES (one color each)
# ======================

[c]
symbol = " "
style = "fg:blue"
format = "[ $symbol($version) ]($style)"

[dotnet]
symbol = " "
style = "fg:purple"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "fg:orange"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "fg:aqua"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "
style = "fg:yellow"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = " "
style = "fg:green"
format = "[ $symbol($version) ]($style)"

[php]
symbol = " "
style = "fg:blue"
format = "[ $symbol($version) ]($style)"

[java]
symbol = " "
style = "fg:red"
format = "[ $symbol($version) ]($style)"

[kotlin]
symbol = " "
style = "fg:purple"
format = "[ $symbol($version) ]($style)"

[haskell]
symbol = " "
style = "fg:aqua"
format = "[ $symbol($version) ]($style)"

# ======================
# 🐳 DOCKER
# ======================

[docker_context]
symbol = " "
style = "fg:gray"
format = "[ $symbol($context) ]($style)"

# ======================
# ➜ PROMPT
# ======================

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[✗](bold fg:red)"
vimcmd_symbol = "[](bold fg:yellow)"
vimcmd_replace_symbol = "[](bold fg:orange)"
vimcmd_visual_symbol = "[](bold fg:purple)"

[line_break]
disabled = false
