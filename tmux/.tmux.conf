unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on

set-window-option -g mode-keys vi
set -g extended-keys on

bind p if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -E -B -w 80% -h 60%  -d '#{pane_current_path}' 'tmux new-session -A -s scratch'
}

bind e if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -x 0 -y 0 -w 40 -h 100% -B -E \
      "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' \
       | fzf --reverse --no-info \
       | cut -d' ' -f1 \
       | xargs -I{} tmux switch-client -t {}"
}

# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

set -s extended-keys on
set -s extended-keys-format csi-u

bind -n S-Enter send-keys Escape "[13;2u"

set-option -g status-position bottom
set-option -g status off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
#bar 
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

#set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'
#/bar

# merge vim statusbar with tmux status bar 
set -g focus-events on
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify centre


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# set -g status-style bg=default
