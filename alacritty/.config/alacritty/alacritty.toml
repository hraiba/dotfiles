
[env]
TERM = "xterm-256color"


[font]
normal.family = "Maple Mono"
bold.family = "Maple Mono"
italic.family = "Maple Mono"
bold_italic.family = "Maple Mono"
size = 14.0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = {shape = "Beam", blinking = "On"}

[window]
opacity = 0.9
blur = true

padding.x = 0
padding.y = 5

decorations = "None"
decorations_theme_variant = "Dark"

[colors.primary]
foreground = "#ebdbb2"
background = "#282828"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.selection]
text = "#282828"
background = "#ebdbb2"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
