[main]
font=JetBrains Mono Nerd Font:size=14,Segoe UI Variable:size=14,CaskaydiaCove Nerd Font Mono:size=12,Noto Sans Mono CJK TC:size=12
prompt=" "
lines=8
width=55
horizontal-pad=20
vertical-pad=20
line-height=25
inner-pad=20
letter-spacing=0.0
dpi-aware=auto
icon-theme=MacTahoe-dark

[border]
radius=10
width=2

